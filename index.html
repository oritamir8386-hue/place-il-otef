<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="מערכת מעקב לפרויקט בינה מלאכותית למען עסקים בעוטף · משימת בית Place-IL · אורי טמיר">
<title>מעקב עסקי העוטף</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a 12-column dashboard grid of cards; boards scroll sideways inside their own track; one side panel per business; the bot floats bottom-left. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E8ECF2; --line:#D5DAE3; --ink:#17202E; --muted:#596274; --faint:#8A92A0;
  --accent:#264B80; --accent-soft:#E1E8F4; --on-accent:#FFFFFF;
  --red:#AE3424; --red-soft:#F8E3DF; --amber:#8F5B00; --amber-soft:#FAEFD7; --green:#2A6E42; --green-soft:#DFF0E5;
  /* chart roles (validated set) */
  --viz:#2a78d6; --viz-track:#cde2fb; --viz-warn:#fab219; --viz-crit:#d03b3b; --viz-good:#0ca30c; --viz-idle:#A3AAB6;
  --fn1:#86b6ef; --fn2:#5598e7; --fn3:#2a78d6; --fn4:#1c5cab; --fn5:#104281;
  /* bot */
  --bot-shell:#FFFFFF; --bot-edge:#BFC8D7; --bot-body:#2F5A96; --bot-screen:#DCE8FA; --bot-eye:#1E3D6B; --bot-light:#F2A93B; --bot-shadow:#0B1020;
  --scrim:rgba(16,22,34,.42); --shadow:0 12px 32px rgba(16,22,34,.16); --shadow-s:0 1px 2px rgba(16,22,34,.06);
  --f-display:"Frank Ruhl Libre","David","Times New Roman",serif;
  --f-body:"IBM Plex Sans Hebrew","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1217; --surface:#171B22; --surface-2:#1F242E; --line:#2D3340; --ink:#E6E9EF; --muted:#9AA2B1; --faint:#6E7686;
  --accent:#8EAEE0; --accent-soft:#1E2B42; --on-accent:#0E1420;
  --red:#F0897A; --red-soft:#3A201C; --amber:#E6B65C; --amber-soft:#382C15; --green:#7FC795; --green-soft:#1A3022;
  --viz:#3987e5; --viz-track:#1E2B42; --viz-idle:#5A6272;
  --fn1:#184f95; --fn2:#256abf; --fn3:#3987e5; --fn4:#6da7ec; --fn5:#9ec5f4;
  --scrim:rgba(0,0,0,.55); --shadow:0 12px 32px rgba(0,0,0,.5); --shadow-s:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1217; --surface:#171B22; --surface-2:#1F242E; --line:#2D3340; --ink:#E6E9EF; --muted:#9AA2B1; --faint:#6E7686;
  --accent:#8EAEE0; --accent-soft:#1E2B42; --on-accent:#0E1420;
  --red:#F0897A; --red-soft:#3A201C; --amber:#E6B65C; --amber-soft:#382C15; --green:#7FC795; --green-soft:#1A3022;
  --viz:#3987e5; --viz-track:#1E2B42; --viz-idle:#5A6272;
  --fn1:#184f95; --fn2:#256abf; --fn3:#3987e5; --fn4:#6da7ec; --fn5:#9ec5f4;
  --scrim:rgba(0,0,0,.55); --shadow:0 12px 32px rgba(0,0,0,.5); --shadow-s:none; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:20px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.date{font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.02em}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.4vw,32px);line-height:1.15;margin:2px 0 0;text-wrap:balance}
.asof{font-size:13px;color:var(--muted);margin-top:4px}
.top-actions{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.role{display:flex;flex-direction:column;gap:5px}
.role-label{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-s)}
kbd{font-family:var(--f-data);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.75;margin-inline-start:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .num{font-size:12px}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px}

/* ---------- generic ---------- */
h2{font-size:15.5px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
h2 .count{font-family:var(--f-data);font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:20px;padding:1px 8px;font-weight:500}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow-s)}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-note{font-size:13px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:14px;background:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.pill.plain::before{display:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:var(--surface-2)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:28px;height:28px;display:inline-grid;place-items:center;font-size:15px;line-height:1;color:var(--muted)}
.icon-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.icon-btn:disabled{opacity:.35;cursor:default}
.linkish{background:none;border:0;padding:0;color:inherit;font-weight:600;text-align:start}
.linkish:hover{color:var(--accent);text-decoration:underline}
.bar{height:8px;background:var(--viz-track);border-radius:4px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--viz);border-radius:4px;transition:width .5s ease}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--viz)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- dashboard grid ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:1000px){.s3{grid-column:span 6}.s4,.s5,.s7,.s8{grid-column:span 12}.s6{grid-column:span 12}.gauge-card.s4{grid-column:span 4}}
@media (max-width:700px){
  .gauge-card.s4{grid-column:span 12;flex-direction:row;justify-content:space-between;text-align:start;padding:12px 14px}
  .gauge-card .g-text{align-items:flex-start}
  .gauge-card .gauge{width:132px;flex:none}
  .board.b4,.board.b5{grid-template-columns:minmax(0,1fr);min-width:0}
  .col{min-height:0}
  .path{overflow-x:auto;padding-bottom:2px}.path li{min-width:96px}
  .ai-char svg{width:64px;height:80px}
  .ai-dock{width:64px}
}
@media (max-width:560px){.s3{grid-column:span 6}}

/* gauge */
.gauge-card{align-items:center;text-align:center;gap:8px}
.gauge-card .g-text{width:100%;display:flex;flex-direction:column;gap:2px;align-items:center}
.gauge{width:100%;max-width:240px;height:auto;display:block}
.gauge.hero{max-width:300px}
.g-track{fill:none;stroke:var(--viz-track);stroke-width:16;stroke-linecap:round}
.g-val{fill:none;stroke:var(--viz);stroke-width:16;stroke-linecap:round;transition:stroke-dasharray .7s ease}
.g-val.warn{stroke:var(--viz-warn)}.g-val.crit{stroke:var(--viz-crit)}
.g-num{font-family:var(--f-body);font-weight:600;font-size:38px;fill:var(--ink);text-anchor:middle}
.gauge.hero .g-num{font-size:44px}
.g-tick{font-family:var(--f-body);font-size:12px;fill:var(--faint);text-anchor:middle}
.g-sub{font-size:13.5px;color:var(--muted)}

/* funnel & hbars */
.fn{display:flex;flex-direction:column;gap:10px}
.fn-row{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:12px;align-items:center}
.fn-label b{font-weight:600;font-size:14px;display:block}
.fn-label .sub{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn-track{display:flex;align-items:center;gap:8px;min-width:0}
.fn-bar{height:22px;border-radius:0;border-start-end-radius:4px;border-end-end-radius:4px;min-width:3px;transition:width .6s ease}
.fn-val{font-size:13px;font-weight:600;white-space:nowrap}
.hb{display:flex;flex-direction:column;gap:10px}
.hb-row{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr);gap:12px;align-items:center;font-size:14px}
.hb-row .fn-bar{height:18px;background:var(--viz)}

/* segmented bar */
.segbar{display:flex;gap:2px;height:28px;border-radius:6px;overflow:hidden;background:var(--surface)}
.segbar span{display:flex;align-items:center;padding-inline:8px;font-size:12.5px;font-weight:600;border-radius:4px;min-width:6px;white-space:nowrap;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}

/* business progress list */
.bp{display:flex;flex-direction:column}
.bp-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(90px,1fr) auto;gap:14px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;text-align:start;width:100%}
.bp-row:last-child{border-bottom:0}
.bp-row:hover .b-name{color:var(--accent)}
.bp-prog{display:flex;align-items:center;gap:8px}
.bp-prog .num{font-size:12px;color:var(--muted);min-width:34px}
.b-name{font-weight:600}

/* timeline */
.tl-wrap{overflow-x:auto}
.tl{display:grid;grid-template-columns:112px repeat(14,minmax(32px,1fr));min-width:560px;font-size:12px}
.tl>div{border-bottom:1px solid var(--line);min-height:40px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;padding:4px 2px}
.tl .tl-name{justify-content:flex-start;padding-inline:4px}
.tl .tl-day{flex-direction:column;gap:0;color:var(--muted);min-height:44px}
.tl .tl-day b{font-weight:600;color:var(--ink);font-size:13px}
.tl .sat{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 8px)}
.tl .today{box-shadow:inset 0 -2px 0 var(--accent)}
.tl .tl-day.today b{color:var(--accent)}
.mk{width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:var(--muted);padding:0;box-sizing:content-box}
.mk.meet{border-radius:2px;transform:rotate(45deg);background:var(--viz);width:11px;height:11px}
.mk.warn{background:var(--viz-warn)}.mk.crit{background:var(--viz-crit)}
.mk:hover,.mk:focus-visible{transform:scale(1.25)}.mk.meet:hover,.mk.meet:focus-visible{transform:rotate(45deg) scale(1.25)}

/* flags & feed */
.flags{display:flex;flex-direction:column;gap:8px}
.flag{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface)}
.flag .f-detail .linkish{font-weight:500;color:var(--ink)}
.flag .f-title{font-weight:600}
.flag .f-detail{font-size:13.5px;color:var(--muted)}
.flag .f-who{font-size:12.5px;color:var(--muted);margin-top:2px}.flag .f-who b{color:var(--ink);font-weight:600}
.flag-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border-bottom:0}
.feed .dot{width:8px;height:8px;border-radius:50%;background:var(--viz);margin-top:7px}
details.rules{font-size:14px;color:var(--muted)}
.owner-name{font-family:var(--f-display);font-size:26px;font-weight:700;display:block;margin:2px 0}
.help{font-size:13px;color:var(--accent);cursor:help;border-bottom:1px dotted currentColor}
details.rules summary{color:var(--accent);font-weight:500;cursor:pointer}
details.rules ul{margin:8px 0 0;padding-inline-start:20px;display:grid;gap:4px}
details.rules b{color:var(--ink)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums}

/* ---------- today ---------- */
.hello{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hello h2{font-size:22px;font-family:var(--f-display);font-weight:700}
.quick{display:grid;grid-template-columns:minmax(0,1fr) 180px 150px auto;gap:8px;align-items:end}
@media (max-width:760px){.quick{grid-template-columns:1fr 1fr}.quick .q-title{grid-column:1/-1}}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink);font-size:14px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- task rows ---------- */
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.trow.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-title{font-weight:500;background:none;border:0;padding:0;text-align:start;cursor:pointer}
.t-title:hover{color:var(--accent)}
.t-meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.t-side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.check{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:none;margin:0}
.due{font-size:12.5px;white-space:nowrap;border-radius:6px;padding:1px 7px;background:var(--surface-2);color:var(--muted)}
.due.crit{background:var(--red-soft);color:var(--red);font-weight:600}
.due.warn{background:var(--amber-soft);color:var(--amber);font-weight:600}
.due.soon{background:var(--accent-soft);color:var(--accent);font-weight:600}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.auto-tag{font-size:11.5px;color:var(--accent);border:1px solid var(--accent-soft);border-radius:6px;padding:0 6px}
.bizchip{font-size:12.5px;background:var(--surface-2);border-radius:6px;padding:1px 7px;border:0;color:var(--ink)}
.bizchip:hover{background:var(--accent-soft)}

/* ---------- boards ---------- */
.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13.5px}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;gap:12px}
.board.b4{grid-template-columns:repeat(4,minmax(240px,1fr));min-width:1000px}
.board.b5{grid-template-columns:repeat(5,minmax(220px,1fr));min-width:1120px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:220px;border:2px dashed transparent;transition:border-color .15s,background .15s}
.col.over{border-color:var(--viz);background:var(--accent-soft)}
.col.blocked{border-color:var(--viz-crit)}
.col-head{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 4px 4px;font-weight:600;font-size:14px}
.col-head .meta{display:flex;align-items:center;gap:6px;font-weight:500}
.col-head .num{font-size:12px;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:grab;box-shadow:var(--shadow-s);text-align:start}
.kcard:hover{border-color:var(--accent)}
.kcard.dragging{opacity:.45}
.kcard .k-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kcard .k-row{font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.kcard .k-row b{color:var(--ink);font-weight:500}
.kcard .k-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.kcard .k-move{display:flex;gap:4px}
.col-add{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px;color:var(--muted);font-size:13.5px}
.col-add:hover{border-color:var(--accent);color:var(--accent)}
.col-empty{font-size:13px;color:var(--faint);padding:6px 4px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(560px,100%);background:var(--bg);z-index:21;box-shadow:var(--shadow);overflow-y:auto;
  padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.closest('#app,#layer')&&a.id!=='biz-filter'){CLOUD.pending=true;return}
  render();
}
document.addEventListener('focusout',()=>{if(CLOUD.pending){CLOUD.pending=false;setTimeout(renderSafe,0);}});
async function initCloud(){
  if(!(window.claude&&typeof window.claude.use==='function')) return;
  let db=null;try{db=await window.claude.use('db')}catch(e){}
  if(!db) return;
  CLOUD.db=db;CLOUD.mode='loading';render();
  try{const u=await window.claude.use('user');if(u){const c=await u.can('data.write');if(c===false)CLOUD.canWrite=false;}}catch(e){}
  CLOUD.timer=setTimeout(()=>{if(CLOUD.mode==='loading'){CLOUD.mode='local';render();toast('אין חיבור לענן כרגע, אז מוצגים נתוני הדוגמה.',{err:true});}},10000);
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const m={};snap.docs.forEach(x=>{const v=x.data();if(v)m[x.id]=v;});CLOUD.remote[c]=m;
      if(!snap.metadata.fromCache) CLOUD.got[c]=true;
      if(CLOUD.mode==='loading'&&COLS.every(x=>CLOUD.got[x])){clearTimeout(CLOUD.timer);CLOUD.mode='live';UNDO=null;}
      if(CLOUD.mode==='live'&&!CLOUD.sandbox) applyRemote();
    },()=>{if(CLOUD.mode==='loading'){clearTimeout(CLOUD.timer);CLOUD.mode='local';render();}});
  });
}

/* ================= dates ================= */
function d(s){if(!s)return null;const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function iso(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function addDays(x,n){const y=new Date(x);y.setDate(y.getDate()+n);return y}
const diff=(a,b)=>Math.round((a-b)/86400000);
const TODAY=d(TODAY_ISO);
const WD=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','שבת'];
function fmt(s){const x=d(s);if(!x)return 'ללא תאריך';return (x.getDay()===6?'שבת':'יום '+WD[x.getDay()])+' '+x.getDate()+'.'+(x.getMonth()+1)}
function fmtShort(s){const x=d(s);if(!x)return 'ללא תאריך';const n=diff(x,TODAY);if(n===0)return 'היום';if(n===1)return 'מחר';return (x.getDay()===6?'שבת':WD[x.getDay()])+' '+x.getDate()+'.'+(x.getMonth()+1)}
function fmtFull(s){const x=d(s);return x.getDate()+'.'+(x.getMonth()+1)+'.'+x.getFullYear()}
const noShabbat=x=>x.getDay()===6?addDays(x,-1):x;
function meetText(b,long){if(!b.meeting)return '';const x=b.meeting.date;return x?(long?fmt(x):fmtShort(x)):(b.meeting.note||'ללא תאריך')}
function dueLabel(t,long){const x=t.due;if(x)return long?fmt(x):fmtShort(x);return t.dueText||'ללא תאריך'}
const critsOf=t=>[].concat(t.crit||[]);

function openTasks(bizId){return S.tasks.filter(t=>!isDone(t)&&(!bizId||t.bizId===bizId))}
function sortByDue(a,b){if(!a.due&&!b.due)return 0;if(!a.due)return 1;if(!b.due)return -1;return a.due<b.due?-1:a.due>b.due?1:0}
const nextStep=b=>openTasks(b.id).sort(sortByDue)[0]||null;

function bizProgress(b){const cs=critStatus(b);return Math.min(1,(stageIdx(b.stage)+(cs.total?cs.done/cs.total:0))/STAGES.length)}
const programProgress=()=>S.businesses.length?S.businesses.reduce((a,b)=>a+bizProgress(b),0)/S.businesses.length:0;

const initials=n=>{const w=String(n).replace(/[^֐-׿A-Za-z ]/g,' ').trim().split(/\s+/);return (w[0]||'?').charAt(0)+(w[1]?w[1].charAt(0):'')};

/* ================= rules ================= */
function computeFlags(){
  const out=[];
  for(const t of S.tasks){
    if(isDone(t)) continue;
    const mb=biz(t.bizId);const waitsMeeting=t.rel==='meeting'&&mb&&mb.meeting&&!mb.meeting.date;
    if(!t.due){if(!waitsMeeting) out.push({sev:'amber',kind:'nodate',bizId:t.bizId,taskId:t.id,who:'רכז.ת',title:'משימה בלי תאריך יעד',detail:t.title,action:{label:'לקבוע תאריך',act:'edit-task'}})}
    else{
      const dd=diff(d(t.due),TODAY);
      if(dd<0) out.push({sev:'red',kind:'overdue',bizId:t.bizId,taskId:t.id,who:t.owner,title:'באיחור של '+(-dd)+' ימים',detail:t.title});
      if(d(t.due).getDay()===6) out.push({sev:'amber',kind:'shabbat',bizId:t.bizId,taskId:t.id,who:'רכז.ת',title:'תאריך היעד נופל בשבת',detail:t.title+' · '+fmt(t.due),action:{label:'להקדים ל'+fmt(iso(addDays(d(t.due),-1))),act:'shift-friday'}});
    }
    if(t.status==='waiting') out.push({sev:'amber',kind:'waiting',bizId:t.bizId,taskId:t.id,who:t.owner,title:t.title,detail:'ממתין להחלטה'+(t.due?' עד '+fmt(t.due):'')});
  }
  for(const b of S.businesses){
    if(b.stage==='done') continue;
    if(b.meeting&&!b.meeting.date) out.push({sev:'amber',kind:'meetnodate',bizId:b.id,who:'רכז.ת',title:b.meeting.label+' בלי תאריך מדויק',detail:'כתוב "'+(b.meeting.note||'')+'". הבריף תלוי בתאריך הזה',action:{label:'לקבוע תאריך',act:'open-biz'}});
    if(b.risk) out.push({sev:'red',kind:'risk',bizId:b.id,who:'מנהלת הפרויקט',title:'עסק בסיכון',detail:b.riskNote||'סומן בסיכון'});
    const lu=lastUpdate(b.id);const gap=lu?diff(TODAY,d(lu)):99;
    if(gap>7) out.push({sev:'amber',kind:'stale',bizId:b.id,who:'רכז.ת',title:'שקט: אין עדכון '+(lu?gap+' ימים':'כלל'),detail:'כדאי לבדוק מה קורה בעסק'});
    const ds=daysInStage(b);
    if(ds>14) out.push({sev:'amber',kind:'stuck',bizId:b.id,who:'רכז.ת',title:'תקוע בשלב '+stageLabel(b.stage)+' '+ds+' ימים',detail:'חסרים '+critStatus(b).missing+' תנאים למעבר שלב'});
    if(!openTasks(b.id).length) out.push({sev:'amber',kind:'nonext',bizId:b.id,who:'רכז.ת',title:'אין צעד הבא',detail:'לעסק אין משימה פתוחה',action:{label:'הוספת משימה',act:'new-task'}});
  }
  return out.sort((a,b)=>(a.sev==='red'?0:1)-(b.sev==='red'?0:1));
}
function health(bizId,flags){
  const f=flags.filter(x=>x.bizId===bizId);const P=isPartner();
  if(f.some(x=>x.sev==='red')) return {cls:'red',label:P?'בליווי צמוד':'בסיכון'};
  if(f.length) return {cls:'amber',label:P?'במעקב':'לתשומת לב'};
  return {cls:'green',label:P?'במסלול':'תקין'};
}
const decisionFlags=flags=>flags.filter(f=>f.sev==='red'||f.kind==='waiting');
function taskSev(t,flags){if(isDone(t))return '';if(!t.due)return 'warn';const dd=diff(d(t.due),TODAY);if(dd<0)return 'crit';if(flags.some(f=>f.taskId===t.id))return 'warn';if(dd<=1)return 'soon';return ''}

/* ================= automation ================= */
function applyTemplates(b){
  let n=0;
  for(const tp of (TEMPLATES[b.stage]||[])){
    if(tp.cond&&!tp.cond(b)) continue;
    let base=tp.rel==='meeting'?(b.meeting&&b.meeting.date?d(b.meeting.date):addDays(TODAY,7)):TODAY;
    let due=addDays(base,tp.off);if(due<TODAY) due=TODAY;due=noShabbat(due);
    S.tasks.push({id:uid('k'),bizId:b.id,title:tp.t,owner:ownerName(b,tp.ot),ownerType:tp.ot,due:iso(due),status:tp.status||'todo',crit:tp.crit||null,tpl:tp.tpl||null,rel:tp.rel||null,off:tp.off,auto:true});
    n++;
  }
  return n;
}
function setTaskStatus(t,st){
  const prev=t.status;if(prev===st) return;
  t.status=st;const b=biz(t.bizId);
  if(b)critsOf(t).forEach(c=>{b.checks[c]=st==='done'});
  addLog(t.bizId,(st==='done'?'בוצע: ':'סטטוס "'+tsLabel(st)+'": ')+t.title);
}

function confetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';
  document.body.appendChild(c);const ctx=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=getComputedStyle(document.documentElement);const pal=['--viz','--viz-warn','--viz-good','--fn1','--viz-crit'].map(v=>cols.getPropertyValue(v).trim()||'#2a78d6');
  const P=[...Array(90)].map(()=>({x:W/2+(Math.random()-.5)*120,y:H*0.45,vx:(Math.random()-.5)*10,vy:-Math.random()*11-4,s:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pal[Math.floor(Math.random()*pal.length)]}));
  let t0=performance.now();
  (function step(t){const k=(t-t0)/1000;ctx.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-k/1.6);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});
    if(k<1.6) requestAnimationFrame(step); else c.remove();})(t0);
}

function timeline(cls,partner){
  const days=[...Array(14)].map((_,i)=>addDays(TODAY,i));
  const flags=computeFlags();
  const undated=partner?0:openTasks().filter(t=>!t.due).length;

    cells+=`<div class="tl-name"><button type="button" class="linkish" data-act="open-biz" data-id="${b.id}">${esc(b.name)}</button></div>`;
    days.forEach((x,i)=>{

const OWNER_FILTERS=[{id:'all',label:'הכול'},{id:'coord',label:'רכז.ת'},{id:'talent',label:'טאלנטים'},{id:'team',label:'צוות Place-IL'}];
function filteredTasks(){return S.tasks.filter(t=>(UI.ownerFilter==='all'||t.ownerType===UI.ownerFilter)&&(UI.bizFilter==='all'||t.bizId===UI.bizFilter))}

          ${items.map(t=>taskCard(t,flags)).join('')||`<div class="col-empty">${st.id==='done'?'עוד לא הושלמו משימות':'אין משימות'}</div>`}
          ${st.id!=='done'?`<button type="button" class="col-add" data-act="new-task" data-status="${st.id}">+ הוספת משימה</button>`:''}
        </div>`}).join('')}</div></div></section>`;
  }
  const groupBy=UI.groupBy||'time';let body='';

    const B=[{l:'באיחור',f:t=>!isDone(t)&&t.due&&diff(d(t.due),TODAY)<0},{l:'היום ומחר',f:t=>!isDone(t)&&t.due&&diff(d(t.due),TODAY)>=0&&diff(d(t.due),TODAY)<=1},{l:'השבוע הקרוב',f:t=>!isDone(t)&&t.due&&diff(d(t.due),TODAY)>1&&diff(d(t.due),TODAY)<=7},{l:'בהמשך',f:t=>!isDone(t)&&t.due&&diff(d(t.due),TODAY)>7},{l:'ללא תאריך',f:t=>!isDone(t)&&!t.due},{l:'בוצעו',f:isDone}];
    body=B.map(bk=>{const it=ts.filter(bk.f).sort(sortByDue);return it.length?`<div class="section"><h2>${bk.l} <span class="count">${it.length}</span></h2>${it.map(t=>taskRow(t,flags)).join('')}</div>`:''}).join('');

function taskCard(t,flags){

  const nx=NEXT_T[t.status],pv=PREV_T[t.status];

/* ================= business moves ================= */
function bizNext(b){
  const i=stageIdx(b.stage);if(i>=STAGES.length-1) return;
  const cs=critStatus(b);
  if(cs.missing){UI.bizOpen=b.id;UI.pathSel=null;render();toast('אי אפשר לעבור ל'+STAGES[i+1].label+': חסרים '+cs.missing+' תנאים. הם מסומנים בכרטיס.',{err:true});return}
  const from=stageLabel(b.stage),to=STAGES[i+1].label;let n=0;
  commit(b.name+' עבר לשלב '+to,()=>{b.stage=STAGES[i+1].id;b.stageSince=TODAY_ISO;UI.pathSel=null;n=applyTemplates(b);addLog(b.id,'עבר משלב '+from+' לשלב '+to+(n?'. נוצרו אוטומטית '+n+' משימות לשלב החדש.':'.'));UI.flash=b.id;});
  confetti();botSay('כל הכבוד! '+b.name+' עבר לשלב '+to+'.'+(n?' יצרתי '+n+' משימות קבועות לשלב.':''));
}
function bizBack(b){
  const i=stageIdx(b.stage);if(i<=0) return;
  const to=STAGES[i-1].label;
  commit(b.name+' הוחזר לשלב '+to,()=>{b.stage=STAGES[i-1].id;b.stageSince=TODAY_ISO;UI.pathSel=null;addLog(b.id,'הוחזר לשלב '+to+'.');UI.flash=b.id;});
}
function checkAllCrit(b){if(b&&!critStatus(b).missing&&stageIdx(b.stage)<STAGES.length-1) botSay('כל תנאי השלב של '+b.name+' הושלמו. אפשר להעביר לשלב '+STAGES[stageIdx(b.stage)+1].label+'.')}

/* ================= actions ================= */
function act(a,id,el){
  switch(a){
    case 'role': UI.role=id;UI.groupBy=null;save();render();renderAI();return;
    case 'open-biz': UI.bizOpen=id;UI.pathSel=null;UI.modal=null;UI.logAll=false;render();return;
    case 'close': if(UI.modal&&UI.modal.type==='goal'&&UI.bizOpen){UI.modal=null;render();return} if(UI.modal) UI.modal=null; else {UI.bizOpen=null;UI.pathSel=null;} render();return;
    case 'path-sel': UI.pathSel=+id;render();return;
    case 'goal-edit': UI.modal={type:'goal',bizId:id};render();return;
    case 'log-all': UI.logAll=!UI.logAll;render();return;
    case 'owner-filter': UI.ownerFilter=id;render();return;
    case 'group': UI.groupBy=id;render();return;
    case 'tmode': UI.taskMode=id;save();render();return;
    case 'new-task': if(!canEdit())return; UI.modal={type:'task',bizId:id&&biz(id)?id:null,status:el&&el.dataset?el.dataset.status:null};render();setTimeout(()=>{const i=document.getElementById('nt-title');if(i)i.focus()},30);return;
    case 'edit-task': if(!canEdit())return; UI.modal={type:'task',taskId:id};render();return;
    case 'toggle-task':{const t=task(id);const to=isDone(t)?'todo':'done';commit(to==='done'?'המשימה סומנה כבוצעה':'המשימה נפתחה מחדש',()=>{setTaskStatus(t,to);UI.flash=t.id;});if(to==='done')checkAllCrit(biz(t.bizId));return;}
    case 'task-next':{const t=task(id);const to=NEXT_T[t.status];if(!to)return;commit('הועבר ל'+tsLabel(to),()=>{setTaskStatus(t,to);UI.flash=t.id;});if(to==='done')checkAllCrit(biz(t.bizId));return;}
    case 'task-prev':{const t=task(id);const to=PREV_T[t.status];if(!to)return;commit('הוחזר ל'+tsLabel(to),()=>{setTaskStatus(t,to);UI.flash=t.id;});return;}
    case 'delete-task':{const t=task(id);commit('המשימה נמחקה',()=>{S.tasks=S.tasks.filter(x=>x.id!==id);addLog(t.bizId,'נמחקה משימה: '+t.title);UI.modal=null;});return;}
    case 'shift-friday':{const t=task(id);commit('תאריך היעד הוקדם ליום שישי',()=>{const old=t.due;t.due=iso(addDays(d(t.due),-1));addLog(t.bizId,'תאריך היעד הוקדם מ'+fmt(old)+' ל'+fmt(t.due)+': '+t.title);UI.flash=t.id;});return;}
    case 'biz-next': bizNext(biz(id));return;
    case 'biz-back': bizBack(biz(id));return;
    case 'approve-goal':{const b=biz(id);commit('היעד אושר',()=>{b.goalDraft=false;addLog(b.id,'היעד אושר מול בעל העסק: '+b.goal);});checkAllCrit(b);return;}
    case 'assign':{const c=talent(id);const b=biz(c.bizId);commit(c.name+' שובץ ל'+b.name,()=>{S.talents.forEach(x=>{if(x.bizId===b.id&&x.status==='candidate'&&x.id!==id){x.status='pool';x.bizId=null;}});c.status='assigned';b.talentId=c.id;addLog(b.id,'שובץ טאלנט: '+c.name+'.');S.tasks.filter(t=>t.bizId===b.id&&t.ownerType==='talent').forEach(t=>t.owner=c.name);});checkAllCrit(b);return;}
    case 'reset': UI.modal={type:'reset'};render();return;
    case 'do-reset': UI.modal=null;UI.bizOpen=null;UNDO=null;if(CLOUD.mode==='live'){CLOUD.sandbox=false;applyRemote();toast('חזרת לנתוני המערכת');return}S=clone(SEED);save();render();toast('הנתונים אופסו');return;
  }
}
const CHANGE_ACTS=['crit','ms','goal','meeting','risk','risk-note'];
document.addEventListener('click',e=>{
  const u=e.target.closest('[data-ui]');
  if(u&&u.dataset.ui==='undo'){if(UNDO){S=UNDO.snap;UNDO=null;save();render();toast('הפעולה בוטלה');}return}
  if(u&&u.dataset.ui==='open-biz'){act('open-biz',u.dataset.id);return}
  const el=e.target.closest('[data-act]');if(!el||!el.closest('#app,#layer')) return;
  const a=el.dataset.act;if(CHANGE_ACTS.includes(a)) return;
  if(a==='toggle-task'){e.preventDefault();act(a,el.dataset.id,el);return}
  if(el.tagName==='A') return;
  e.preventDefault();act(a,el.dataset.id,el);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.ui==='biz-filter'){UI.bizFilter=el.value;render();return}
  if(el.dataset&&el.dataset.ui==='owner-biz'){UI.ownerBiz=el.value;save();render();return}
  const a=el.dataset&&el.dataset.act;if(!a||!CHANGE_ACTS.includes(a)) return;
  const b=biz(el.dataset.id);if(!b) return;
  if(a==='crit'){const c=(CRIT[b.stage]||[]).find(x=>x.id===el.dataset.crit);const v=el.checked;
    commit((v?'הושלם תנאי: ':'בוטל תנאי: ')+c.t,()=>{b.checks[c.id]=v;S.tasks.filter(t=>t.bizId===b.id&&critsOf(t).includes(c.id)).forEach(t=>{t.status=v?'done':(t.status==='done'?'todo':t.status)});addLog(b.id,(v?'הושלם תנאי: ':'בוטל תנאי: ')+c.t);});
    if(v) checkAllCrit(b);return}
  if(a==='ms'){const m=b.milestones.find(x=>x.id===el.dataset.ms);const v=el.checked;
    commit(v?'אבן דרך הושגה':'אבן הדרך נפתחה מחדש',()=>{m.done=v;addLog(b.id,(v?'הושגה אבן דרך: ':'אבן דרך נפתחה מחדש: ')+m.t);});
    if(v){confetti();if(b.milestones.every(x=>x.done)) botSay('כל אבני הדרך של '+b.name+' הושגו!');}return}
  if(a==='goal'){const v=el.value.trim();if(v===b.goal) return;commit('היעד עודכן',()=>{b.goal=v;if(!v)b.goalDraft=false;if(v)addLog(b.id,'עודכן היעד: '+v);});return}
  if(a==='meeting'){if(!el.value) return;const v=el.value;commit('הפגישה נקבעה ל'+fmt(v),()=>{b.meeting={date:v,label:(b.meeting&&b.meeting.label)||'פגישת התנעה'};
    S.tasks.filter(t=>t.bizId===b.id&&!isDone(t)&&t.tpl==='set-meeting').forEach(t=>{t.status='done'});
    let moved=0;S.tasks.filter(t=>t.bizId===b.id&&!isDone(t)&&t.rel==='meeting').forEach(t=>{let x=addDays(d(v),t.off||0);if(x<TODAY)x=TODAY;t.due=iso(x);moved++;});
    addLog(b.id,b.meeting.label+' נקבעה ל'+fmt(v)+(moved?'. '+moved+' משימות שתלויות בפגישה עודכנו.':'.'));});return}
  if(a==='risk'){const v=el.checked;commit(v?'העסק סומן בסיכון':'סימון הסיכון הוסר',()=>{b.risk=v;if(!v)b.riskNote='';addLog(b.id,v?'העסק סומן בסיכון.':'סימון הסיכון הוסר.');});return}
  if(a==='risk-note'){b.riskNote=el.value;save();render();return}
});

  if(e.target.id==='nt-due'){const h=document.getElementById('nt-hint');if(h){const x=d(e.target.value);h.textContent=x&&x.getDay()===6?'התאריך נופל בשבת. כדאי להקדים ליום שישי.':''}}

document.addEventListener('submit',e=>{

/* first visit: introduce once, then step aside */
try{AI.intro=localStorage.getItem(STORE_KEY+'-hi')!=='1'}catch(e){AI.intro=true}
if(AI.intro) setTimeout(()=>{AI.intro=false;try{localStorage.setItem(STORE_KEY+'-hi','1')}catch(_){}if(!AI.open)renderAI();},10000);
let botDrag=null;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest&&e.target.closest('.ai-char');if(!c||AI.open) return;
  const dock=document.getElementById('ai-dock');const r=dock.getBoundingClientRect();
  botDrag={sx:e.clientX,sy:e.clientY,ox:r.left,oy:r.top,moved:false,id:e.pointerId};
  try{c.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!botDrag||e.pointerId!==botDrag.id) return;
  const dx=e.clientX-botDrag.sx,dy=e.clientY-botDrag.sy;
  if(!botDrag.moved&&Math.hypot(dx,dy)<5) return;
  botDrag.moved=true;const dock=document.getElementById('ai-dock');if(!dock) return;
  dock.classList.add('dragging');
  const x=Math.min(Math.max(botDrag.ox+dx,4),innerWidth-BOT_W-4),y=Math.min(Math.max(botDrag.oy+dy,4),innerHeight-BOT_H-4);
  dock.style.left=x+'px';dock.style.top=y+'px';dock.style.bottom='auto';dock.classList.toggle('right',x>innerWidth/2);
  AI.pos={x,y};
});
function endBotDrag(e){
  if(!botDrag||(e&&e.pointerId!==botDrag.id)) return;
  const moved=botDrag.moved;botDrag=null;
  const dock=document.getElementById('ai-dock');if(dock)dock.classList.remove('dragging');
  if(moved){AI.dragged=true;setTimeout(()=>{AI.dragged=false},0);try{localStorage.setItem(STORE_KEY+'-botpos',JSON.stringify(AI.pos))}catch(_){}}
}
document.addEventListener('pointerup',endBotDrag);
document.addEventListener('pointercancel',endBotDrag);
window.addEventListener('resize',()=>{if(AI.pos&&!AI.open)renderAI();});
/* eyes follow the pointer */
let lookRaf=0;
document.addEventListener('pointermove',e=>{
  if(AI.open||lookRaf||e.pointerType==='touch') return;
  lookRaf=requestAnimationFrame(()=>{lookRaf=0;const g=document.getElementById('bot-look');if(!g)return;
    const r=g.closest('svg').getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height*0.36;
    const dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.hypot(dx,dy)||1,k=Math.min(1,dist/240);
    g.style.transform=`translate(${(dx/dist*3.2*k).toFixed(2)}px,${(dy/dist*2.4*k).toFixed(2)}px)`;});
});
const AI_ERR={rate_limited:'יותר מדי שאלות ברצף. כדאי לנסות שוב בעוד רגע.',session_expired:'צריך להתחבר מחדש ל-Claude.',refused:'לא אוכל לענות על זה. אפשר לנסח את השאלה אחרת.',empty_completion:'לא התקבלה תשובה. אפשר לנסח את השאלה אחרת.',prompt_too_large:'השיחה ארוכה מדי. כדאי להתחיל שיחה חדשה.',upstream_error:'התשובה נקטעה בגלל תקלה. אפשר לשאול שוב.'};
async function ask(q,chipId){
  if(AI.busy) return;
  AI.turns.push({role:'user',content:q});
  const local=chipId?localAnswer(chipId):null;const NOTE='תשובה מהירה מתוך הנתונים, בלי AI';
  if(AI.sample===null||AI.blocked||AI.sample===undefined){
    AI.turns.push({role:'assistant',content:local||(AI.sample===undefined?'רגע, אני עוד מתחבר. אפשר לנסות שוב בעוד כמה שניות.':'שיחה חופשית לא זמינה כרגע.'),note:local?NOTE:'',local:true});renderAI();return;
  }
  AI.busy=true;AI.streaming='';AI.ctl=new AbortController();renderAI();
  const hist=AI.turns.filter(t=>!t.local).slice(-10).map(t=>({role:t.role,content:t.content}));while(hist.length&&hist[0].role!=='user')hist.shift();
  try{
    const {text}=await AI.sample([{role:'user',content:aiRules()},...hist],{cache:false,modelTier:'quick',signal:AI.ctl.signal,
      onText:({text})=>{AI.streaming=text;const el=document.getElementById('ai-stream');if(el){el.innerHTML=md(text);const b=document.getElementById('ai-body');if(b)b.scrollTop=b.scrollHeight;}}});
    AI.turns.push({role:'assistant',content:text});
  }catch(e){
    const code=e&&e.code;
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){AI.blocked=true;AI.turns.push({role:'assistant',content:local||'שיחה חופשית לא זמינה כרגע, אז אני עונה רק על השאלות המהירות.',note:local?NOTE:'',local:true});}
    else if(code==='cancelled'){if(e.text)AI.turns.push({role:'assistant',content:e.text,note:'נעצר'});}
    else AI.turns.push({role:'assistant',content:(e&&e.text)||AI_ERR[code]||AI_ERR.upstream_error,note:e&&e.text?(AI_ERR[code]||AI_ERR.upstream_error):'',local:!(e&&e.text)});
  }finally{AI.busy=false;AI.streaming='';AI.ctl=null;renderAI();}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-ai]');if(!el) return;const a=el.dataset.ai;
  const seen=()=>{try{localStorage.setItem(STORE_KEY+'-hi','1')}catch(_){}};
  if(a==='dismiss'){seen();AI.intro=false;renderAI();}
  else if(a==='hush'){AI.say=null;renderAI();}
  else if(a==='open'){if(AI.dragged)return;seen();AI.intro=false;AI.say=null;AI.open=true;renderAI();const i=document.getElementById('ai-input');if(i&&!i.disabled)i.focus();}
  else if(a==='close'){AI.open=false;renderAI();}
  else if(a==='clear'){if(AI.ctl)AI.ctl.abort();AI.turns=[];renderAI();}
  else if(a==='stop'){if(AI.ctl)AI.ctl.abort();}
  else if(a==='chip'){const c=[...CHIPS_STAFF,...CHIPS_PARTNER,...CHIPS_OWNER].find(x=>x.id===el.dataset.id);if(c)ask(c.q,c.id);}
});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form!=='ai')return;e.preventDefault();const i=document.getElementById('ai-input');const q=i.value.trim();if(!q||AI.busy)return;i.value='';ask(q,null);});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='ai-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const f=e.target.closest('form');if(f)f.requestSubmit();}});
const AI_PROXY='https://place-il-ai.oritamir8386.workers.dev/';
function proxySample(){
  return async function(msgs,opts={}){
    const system=msgs[0]&&msgs[0].role==='user'?msgs[0].content:'';
    const messages=msgs.slice(1);let text='';let res;
    try{res=await fetch(AI_PROXY,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({system,messages}),signal:opts.signal});}
    catch(e){throw (e&&e.name==='AbortError')?{code:'cancelled',text}:{code:'sampling_disabled'};}
    if(!res.ok){let c='sampling_disabled';try{const j=await res.json();if(j&&j.error==='rate_limited')c='rate_limited';}catch(_){}throw {code:c};}
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
    try{
      for(;;){const r=await reader.read();if(r.done)break;buf+=dec.decode(r.value,{stream:true});
        let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
          if(!line.startsWith('data:'))continue;let ev;try{ev=JSON.parse(line.slice(5));}catch(_){continue;}
          if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){text+=ev.delta.text;if(opts.onText)opts.onText({text});}
          else if(ev.type==='error'){throw {code:'upstream_error',text};}}}
    }catch(e){if(e&&e.code)throw e;throw (e&&e.name==='AbortError')?{code:'cancelled',text}:{code:'upstream_error',text};}
    if(!text.trim())throw {code:'empty_completion'};
    return {text};
  };
}
if(window.claude&&typeof window.claude.use==='function'){window.claude.use('sample').then(s=>{AI.sample=s||null;if(AI.open)renderAI(true);}).catch(()=>{AI.sample=null;if(AI.open)renderAI(true);});}else{AI.sample=AI_PROXY?proxySample():null;}

render();renderAI();initCloud();
})();
</script>
